-- Interface type lookup table
CREATE TABLE IF NOT EXISTS interface_type (
    code         INTEGER PRIMARY KEY,
    name         TEXT NOT NULL,
    description  TEXT
);

-- Pre-populate interface types
INSERT OR IGNORE INTO interface_type (code, name, description) VALUES (0, 'ethernet', 'Standard physical wired connection.');
INSERT OR IGNORE INTO interface_type (code, name, description) VALUES (1, 'wireless', 'Wi-Fi (detected via wireless or phy80211 attributes).');
INSERT OR IGNORE INTO interface_type (code, name, description) VALUES (2, 'mobile', 'WWAN / Cellular (detected via wwan attribute).');
INSERT OR IGNORE INTO interface_type (code, name, description) VALUES (100, 'virtual', 'Generic virtual interface.');
INSERT OR IGNORE INTO interface_type (code, name, description) VALUES (101, 'loopback', 'Local loopback (lo).');
INSERT OR IGNORE INTO interface_type (code, name, description) VALUES (102, 'bridge', 'Network bridges (br-* or bridge attributes).');
INSERT OR IGNORE INTO interface_type (code, name, description) VALUES (105, 'vpn', 'VPN/Tunnels (tun*, tap*, wg*, or tun_flags).');
INSERT OR IGNORE INTO interface_type (code, name, description) VALUES (106, 'veth', 'Docker / Container virtual ethernet (veth*, docker*).');

-- Host table
CREATE TABLE IF NOT EXISTS host (
    id           INTEGER PRIMARY KEY AUTOINCREMENT,
    machine_id   TEXT UNIQUE NOT NULL,
    hostname     TEXT NOT NULL,
    version      TEXT,
    started      INTEGER,
    last_seen    INTEGER
);

-- Interface table
CREATE TABLE IF NOT EXISTS interface (
    id           INTEGER PRIMARY KEY AUTOINCREMENT,
    host_id      INTEGER NOT NULL REFERENCES host(id) ON DELETE CASCADE,
    name         TEXT NOT NULL,
    alias        TEXT,
    interface_type INTEGER REFERENCES interface_type(code),
    mac_address  TEXT,
    active       INTEGER NOT NULL DEFAULT 1,
    created      INTEGER NOT NULL,
    updated      INTEGER NOT NULL,
    rxcounter    INTEGER NOT NULL DEFAULT 0,
    txcounter    INTEGER NOT NULL DEFAULT 0,
    rxtotal      INTEGER NOT NULL DEFAULT 0,
    txtotal      INTEGER NOT NULL DEFAULT 0,
    CONSTRAINT u_host_name UNIQUE(host_id, name)
);

-- Resolution tables
CREATE TABLE IF NOT EXISTS fiveminute (
    id           INTEGER PRIMARY KEY AUTOINCREMENT,
    interface    INTEGER REFERENCES interface(id) ON DELETE CASCADE,
    date         INTEGER NOT NULL,
    rx           INTEGER NOT NULL,
    tx           INTEGER NOT NULL,
    CONSTRAINT u UNIQUE (interface, date)
);

CREATE TABLE IF NOT EXISTS hour (
    id           INTEGER PRIMARY KEY AUTOINCREMENT,
    interface    INTEGER REFERENCES interface(id) ON DELETE CASCADE,
    date         INTEGER NOT NULL,
    rx           INTEGER NOT NULL,
    tx           INTEGER NOT NULL,
    CONSTRAINT u UNIQUE (interface, date)
);

CREATE TABLE IF NOT EXISTS day (
    id           INTEGER PRIMARY KEY AUTOINCREMENT,
    interface    INTEGER REFERENCES interface(id) ON DELETE CASCADE,
    date         INTEGER NOT NULL,
    rx           INTEGER NOT NULL,
    tx           INTEGER NOT NULL,
    CONSTRAINT u UNIQUE (interface, date)
);

CREATE TABLE IF NOT EXISTS month (
    id           INTEGER PRIMARY KEY AUTOINCREMENT,
    interface    INTEGER REFERENCES interface(id) ON DELETE CASCADE,
    date         INTEGER NOT NULL,
    rx           INTEGER NOT NULL,
    tx           INTEGER NOT NULL,
    CONSTRAINT u UNIQUE (interface, date)
);

CREATE TABLE IF NOT EXISTS year (
